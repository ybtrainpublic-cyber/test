<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ '로봇 수정' if action == 'edit' else '새 로봇 추가' }}</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 600px;">
        <h1 class="mb-4">{{ '로봇 수정' if action == 'edit' else '새 로봇 추가' }}</h1>
        <div class="card">
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="robot_name" class="form-label">로봇 이름:</label>
                        <input type="text" class="form-control" id="robot_name" name="robot_name" value="{{ robot.robot_name if robot else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="model" class="form-label">모델명:</label>
                        <input type="text" class="form-control" id="model" name="model" value="{{ robot.model if robot else '' }}" required>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">취소</a>
                        <button type="submit" class="btn btn-primary">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
