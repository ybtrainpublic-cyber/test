<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ '작업 수정' if action == 'edit' else '새 작업 추가' }}</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 600px;">
        <h1 class="mb-4">{{ '작업 수정' if action == 'edit' else '새 작업 추가' }}</h1>
        <div class="card">
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="task_name" class="form-label">작업 이름:</label>
                        <input type="text" class="form-control" id="task_name" name="task_name" value="{{ task.task_name if task else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">상태:</label>
                        <select class="form-select" id="status" name="status">
                            <option value="대기" {{ 'selected' if task and task.status == '대기' }}>대기</option>
                            <option value="진행중" {{ 'selected' if task and task.status == '진행중' }}>진행중</option>
                            <option value="완료" {{ 'selected' if task and task.status == '완료' }}>완료</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">취소</a>
                        <button type="submit" class="btn btn-primary">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
